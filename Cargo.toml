[workspace]
members = [
    "crates/rh_engine",
    "crates/rh_cert",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["PerceivingAI <ai.content@outlook.com>"]
repository = "https://github.com/PerceivingAI/riemann-conjecture"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
