[project]
name = "riemann-conjecture"
version = "0.1.0"
description = "Organized, auditable research repository for Riemann Hypothesis investigations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mpmath>=1.3.0",
    "scipy>=1.15.0",
    "python-flint>=0.9.0",
    "gmpy2>=2.2.0",
    "numpy>=2.0.0",
    "sympy>=1.13.0",
    "matplotlib>=3.9.0",
    "jsonschema>=4.23.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "hypothesis>=6.100.0",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --strict-markers -n 2 -m 'not slow_acceptance and not retained_proofs and not parallel_acceptance'"
markers = [
    "integration: real continuation-history tests using Arb assembly and exact candidate construction",
    "slow_acceptance: expensive manual acceptance tests excluded from routine pytest runs",
    "retained_proofs: real replay of all registered retained theorem certificates; excluded from routine pytest runs",
    "parallel_acceptance: real spawn-based continuation replays validating parallel/sequential semantics; excluded from routine pytest runs",
]
